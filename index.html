<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Loss Tracker</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAe_2xEx6uCEPZr4MdOIBw4gCSJKxC1wi4",
  authDomain: "loss-tracker-7bd9a.firebaseapp.com",
  projectId: "loss-tracker-7bd9a",
  storageBucket: "loss-tracker-7bd9a.firebasestorage.app",
  messagingSenderId: "147406962467",
  appId: "1:147406962467:web:ab3fba8fa191a8e9ac5696"
};
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Daily Loss
      <span id="conn-status" style="margin-left:auto;font-size:10px;font-weight:400;color:var(--text-secondary)"></span>
    </div>
    <button class="nav-item active" data-page="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Daily Log
    </button>
    <button class="nav-item" data-page="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
    <button class="nav-item" data-page="products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M12 22V12"/><path d="M3.3 7L12 12l8.7-5"/></svg>
      Products
    </button>
  </aside>

  <main class="main">
    <div class="store-bar">
      <label>Store:</label>
      <select id="store-select" onchange="switchStore(this.value)"></select>
      <button onclick="addStore()">+ New</button>
      <button onclick="deleteStore()" style="color:var(--danger)">Remove</button>
    </div>

    <!-- Daily Log -->
    <section class="page active" id="page-log">
      <h1>Daily Log</h1>
      <p class="subtitle">Enter loss quantities for each item</p>
      <div class="card" style="padding:14px 18px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:6px">
            <label style="font-size:12px;font-weight:500;color:var(--text-secondary)">Date:</label>
            <input type="date" id="log-date" style="width:150px">
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="btn btn-primary" onclick="saveDailyLog()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save
            </button>
            <span id="log-save-status" style="font-size:12px;color:var(--success);font-weight:500"></span>
          </div>
        </div>
      </div>
      <div class="card" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr><th style="width:36px">#</th><th>Item</th><th style="width:120px">Loss Qty</th><th style="width:60px">Unit</th></tr></thead>
            <tbody id="log-tbody"></tbody>
          </table>
        </div>
      </div>
      <div style="text-align:right;margin-top:10px">
        <span id="log-total-label" style="font-size:12px;color:var(--text-secondary)">Items with loss: 0</span>
      </div>
    </section>

    <!-- History -->
    <section class="page" id="page-history">
      <h1>History</h1>
      <p class="subtitle">View past loss records</p>
      <div class="view-toggle" id="hist-view-toggle">
        <button class="active" data-view="day">Day</button>
        <button data-view="week">Week</button>
      </div>
      <div id="hist-day-view">
        <div class="date-nav">
          <button onclick="histPrev()">&larr; Prev</button>
          <input type="date" id="hist-date" onchange="renderHistory()" style="width:170px;text-align:center;font-weight:600">
          <button onclick="histNext()">Next &rarr;</button>
          <button class="btn btn-sm btn-danger" onclick="deleteHistory()" style="margin-left:auto">Delete</button>
        </div>
        <div class="stats" id="hist-stats"></div>
        <div class="card" style="padding:0">
          <div class="table-wrap">
            <table><thead><tr><th style="width:36px">#</th><th>Item</th><th style="width:90px">Loss Qty</th><th style="width:60px">Unit</th><th style="width:80px">Status</th></tr></thead><tbody id="hist-tbody"></tbody></table>
          </div>
          <div class="empty" id="hist-empty"><p>No losses recorded for this date</p></div>
        </div>
      </div>
      <div id="hist-week-view" style="display:none">
        <div class="date-nav">
          <button onclick="weekPrev()">&larr; Prev Week</button>
          <span id="hist-week-label" style="font-weight:600;min-width:190px;text-align:center"></span>
          <button onclick="weekNext()">Next Week &rarr;</button>
        </div>
        <div class="card" style="padding:0">
          <div class="table-wrap">
            <table class="week-table">
              <thead id="week-thead"></thead>
              <tbody id="week-tbody"></tbody>
            </table>
          </div>
          <div class="empty" id="week-empty"><p>No losses in this week</p></div>
        </div>
      </div>
    </section>

    <!-- Products -->
    <section class="page" id="page-products">
      <h1>Products</h1>
      <p class="subtitle">Manage your tracked items</p>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <input type="text" id="new-prod-name" placeholder="Add new item..." style="flex:1;max-width:240px">
        <select id="new-prod-cat" style="width:130px"></select>
        <select id="new-prod-unit" style="width:70px">
          <option value="g">g</option><option value="pcs">pcs</option>
        </select>
        <button class="btn btn-primary" onclick="addProduct()">Add</button>
      </div>
      <div class="card" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead><tr><th style="width:28px"></th><th>Item</th><th style="width:110px">Category</th><th style="width:70px">Unit</th><th style="width:70px"></th></tr></thead>
            <tbody id="prod-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Mobile nav -->
<nav class="mobile-nav">
  <button class="nav-item active" data-page="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Log
  </button>
  <button class="nav-item" data-page="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    History
  </button>
  <button class="nav-item" data-page="products">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M12 22V12"/><path d="M3.3 7L12 12l8.7-5"/></svg>
    Products
  </button>
</nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
